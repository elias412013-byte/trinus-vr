name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive App
        run: |
          xcodebuild -project TrinusVR.xcodeproj \
            -scheme TrinusVR \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/TrinusVR.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/TrinusVR.xcarchive/Products/Applications/TrinusVR.app Payload/
          zip -r TrinusVR-iOS.ipa Payload
          rm -rf Payload

      - name: Upload Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: TrinusVR-iOS-IPA
          path: TrinusVR-iOS.ipa
