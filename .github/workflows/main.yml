name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Compilar App y Generar IPA
        run: |
          # 1. Crear estructura de compilación temporal
          mkdir -p Payload
          
          # 2. Compilar usando swiftc directo con los frameworks necesarios
          swiftc -target arm64-apple-ios12.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            iOSApp/AppDelegate.swift -o TrinusVR-iOS -framework UIKit -framework CoreMotion -framework Network
          
          # 3. Organizar dentro del Payload para la IPA
          mkdir -p TrinusVR-iOS.app
          mv TrinusVR-iOS TrinusVR-iOS.app/TrinusVR-iOS
          cp iOSApp/Info.plist TrinusVR-iOS.app/Info.plist
          mv TrinusVR-iOS.app Payload/
          
          # 4. Comprimir en formato .ipa
          zip -r TrinusVR-iOS.ipa Payload/
          rm -rf Payload

      - name: Subir Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: TrinusVR-iOS-IPA
          path: TrinusVR-iOS.ipa
