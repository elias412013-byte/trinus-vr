name: TrinusVR
options:
  bundleIdPrefix: com.trinusios
  deploymentTarget:
    iOS: "12.0"
targets:
  TrinusVR:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: iOSApp
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: "TrinusVR"
        UILaunchStoryboardName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
          - gyroscope
          - accelerometer
        NSCameraUsageDescription: "Se requiere para la transmisión VR"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trinusios.client
      SWIFT_VERSION: "5.0"
      IPHONEOS_DEPLOYMENT_TARGET: "12.0"
